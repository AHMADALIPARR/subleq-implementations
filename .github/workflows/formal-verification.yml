name: Formal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "Verify on Racket ${{ matrix.racket-version }} (${{ matrix.racket-variant }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        racket-version: ['8.10']
        racket-variant: ['CS']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: ${{ matrix.racket-variant }}
          version: ${{ matrix.racket-version }}

      - name: Install Rosette and dependencies
        run: |
          raco pkg install --auto --skip-installed rosette
          raco pkg install --auto --skip-installed rackunit

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make git

      - name: Build and install Boolector (solver for Rosette)
        run: |
          git clone --depth 1 https://github.com/boolector/boolector.git
          cd boolector
          ./contrib/setup-lingeling.sh
          ./contrib/setup-btor2tools.sh
          ./configure.sh
          cd build
          make -j$(nproc)
          sudo make install
          cd ../..
          rm -rf boolector

      - name: Verify Boolector is available
        run: |
          which boolector || true
          ldconfig -p | grep -i boolector || true

      - name: Run formal verification (with metrics)
        run: |
          echo "=== SUBLEQ RISC-V Formal Verification ==="
          echo "Start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START=$(date +%s)
          
          # Run the verification suite
          racket racket/verify.rkt || true
          
          END=$(date +%s)
          DURATION=$((END - START))
          echo "=== Metrics ==="
          echo "Duration (seconds): $DURATION"
          echo "End: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Racket version: $(racket --version)"
          echo "Rosette solver: Boolector (via FFI when available)"

      - name: Collect verification artifacts
        if: always()
        run: |
          mkdir -p verification-results
          echo "Verification run completed" > verification-results/summary.txt
          ls -la racket/ || true

      - name: Upload verification metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-metrics-${{ matrix.racket-version }}
          path: verification-results/
