name: Formal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "Verify on Racket ${{ matrix.racket-version }} (${{ matrix.racket-variant }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        racket-version: ['8.10']
        racket-variant: ['CS']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: ${{ matrix.racket-variant }}
          version: ${{ matrix.racket-version }}

      - name: Install dependencies via Makefile
        run: make install-deps install-rosette

      - name: Build Boolector via Makefile
        run: make build-boolector

      - name: Verify Boolector is available
        run: |
          which boolector || true
          ldconfig -p | grep -i boolector || true

      - name: Run formal verification with metrics
        run: make metrics

      - name: Collect verification artifacts
        if: always()
        run: |
          mkdir -p verification-results
          echo "Verification run completed" > verification-results/summary.txt
          ls -la racket/ || true

      - name: Upload verification metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-metrics-${{ matrix.racket-version }}
          path: verification-results/
