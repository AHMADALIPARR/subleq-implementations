name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RACKET_VERSION: '9.3'
  FACTOR_URL: https://downloads.factorcode.org/releases/0.102/factor-linux-x86-64-0.102.tar.gz

jobs:
  racket:
    name: Racket tests + Rosette verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ env.RACKET_VERSION }}
      - name: Install Rosette
        run: raco pkg install --auto --batch --skip-installed rosette
      - name: Racket unit tests (rackunit)
        run: make test-racket
      - name: Rosette microcode verification (exits 1 on any FAIL)
        run: make metrics
      - name: OISC ADD/SUB experiment (exits 1 on FAIL/UNKNOWN)
        run: make oisc

  forth:
    name: Forth tests (gforth)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gforth
        run: |
          # Workaround for intermittent DNS/mirror failures on azure.archive.ubuntu.com
          # (known flaky issue on GitHub Actions Ubuntu runners).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 gforth
          gforth --version
      - name: Forth unit tests
        run: make test-forth

  factor:
    name: Factor tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Factor
        run: |
          curl -fsSL "$FACTOR_URL" -o /tmp/factor.tar.gz
          tar -xzf /tmp/factor.tar.gz -C "$HOME"
          "$HOME/factor/factor" -e='USING: io system ; vm-version print'
      - name: Factor unit tests
        run: make test-factor FACTOR="$HOME/factor/factor"

  lean:
    name: Lean 4 build + trusted-path check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build (toolchain from lean/lean-toolchain)
        run: make lean
      - name: No sorry/admit/axiom/unsafe; only standard axioms
        run: make lean-check
      - name: Fault-model Lean project (lean-fault/, toolchain from lean-fault/lean-toolchain)
        run: make lean-fault-check

  differential:
    name: Differential test (Racket, Factor, Forth, Lean)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ env.RACKET_VERSION }}
      - name: Install gforth
        run: |
          # Workaround for intermittent DNS/mirror failures on azure.archive.ubuntu.com
          # (known flaky issue on GitHub Actions Ubuntu runners).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 gforth
      - name: Install Factor
        run: |
          curl -fsSL "$FACTOR_URL" -o /tmp/factor.tar.gz
          tar -xzf /tmp/factor.tar.gz -C "$HOME"
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fixtures + 200 seeded random programs
        run: |
          mkdir -p verification-results
          set -o pipefail
          make differential FACTOR="$HOME/factor/factor" 2>&1 | tee verification-results/differential.txt
      - name: SHA-256 NIST vectors on all machines
        run: |
          set -o pipefail
          make sha256 FACTOR="$HOME/factor/factor" 2>&1 | tee verification-results/sha256.txt
      - name: Killer app (keystream) on the directive machine and the original
        run: |
          set -o pipefail
          make killer-app FACTOR="$HOME/factor/factor" 2>&1 | tee verification-results/killer-app.txt
      - name: Upload differential log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-results
          path: verification-results/
